plugins { id 'com.android.library' }

android {
  namespace 'dev.taurinative.lynx.retained'
  compileSdk 35
  defaultConfig {
    minSdk 24
    consumerProguardFiles 'consumer-rules.pro'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation project(':tauri-native-runtime-client')
  implementation 'androidx.annotation:annotation:1.9.1'
  implementation 'com.google.code.gson:gson:2.14.0'
  api 'org.lynxsdk.lynx:lynx:4.0.1'
  implementation 'org.lynxsdk.lynx:lynx-jssdk:4.0.1'
  implementation 'org.lynxsdk.lynx:lynx-trace:4.0.1'
  implementation 'org.lynxsdk.lynx:primjs:4.0.0'
}
