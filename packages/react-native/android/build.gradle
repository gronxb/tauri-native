buildscript {
  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${rootProject.ext.has('kotlinVersion') ? rootProject.ext.get('kotlinVersion') : '2.1.20'}")
  }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.facebook.react'

def getExtOrDefault(name, fallback) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

android {
  namespace 'com.reactnativetauri'
  compileSdkVersion getExtOrDefault('compileSdkVersion', 35)

  if (rootProject.ext.has('ndkVersion')) {
    ndkVersion rootProject.ext.get('ndkVersion')
  }

  defaultConfig {
    minSdkVersion getExtOrDefault('minSdkVersion', 24)
    targetSdkVersion getExtOrDefault('targetSdkVersion', 35)
    consumerProguardFiles 'consumer-rules.pro'

    externalNativeBuild {
      cmake {
        cppFlags '-std=c++17'
      }
    }
  }

  externalNativeBuild {
    cmake {
      path 'src/main/jni/CMakeLists.txt'
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
}
