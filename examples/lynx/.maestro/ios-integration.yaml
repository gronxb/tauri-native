appId: dev.tauri-native.lynx-example
---
- launchApp
- swipe:
    start: "50%,85%"
    end: "50%,25%"
    duration: 600
- waitForAnimationToEnd
- assertVisible: 'invoke("calculate")'
- scrollUntilVisible:
    element:
      id: "lynx-calculator-expression"
    direction: UP
    timeout: 10000
- tapOn:
    id: "lynx-calculator-expression"
    point: "99%,50%"
- eraseText: 200
- inputText: "9 * (6 - 2)"
- hideKeyboard
- tapOn:
    id: "lynx-calculator-button"
- assertVisible: "Result: 36"
- assertVisible: "tauri-native-example-core"
- scrollUntilVisible:
    element:
      text: "Calculate Tauri expression in Rust"
    direction: DOWN
    timeout: 10000
- tapOn: "7 * (8 - 2)"
- eraseText: 100
- inputText: "18 / (2 + 1)"
- pressKey: Enter
- assertVisible: "Rust returned"
- assertVisible: "= 6"
- assertVisible: "tauri-native-example-core"
