[package]
name = "tauri-native-tauri-example"
version = "0.1.0"
description = "Standard Tauri scaffold used as a tauri-native microfrontend"
authors = ["tauri-native contributors"]
edition = "2021"
publish = false

[lib]
name = "tauri_native_tauri_example_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-native-example-core = { path = "crates/app-core" }
