name: Native acceptance tools
description: Install the pinned producer or consumer acceptance toolchain
inputs:
  producer:
    description: Install Rust and export tools
    default: 'false'
runs:
  using: composite
  steps:
    - uses: nubjs/setup-nub@v0.4.0
      with:
        node-version: 24.15.0
        nub-version: 0.8.3
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - if: runner.os == 'macOS'
      shell: bash
      run: |
        sudo xcode-select -s /Applications/Xcode_26.4.1.app
        node scripts/ci/ios-simulator.ts
    - if: inputs.producer == 'true' || runner.os == 'Linux'
      shell: bash
      run: |
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.1.12297006' 'build-tools;37.0.0' 'build-tools;36.0.0' 'platforms;android-35' 'platforms;android-36' 'cmake;3.22.1'
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
        echo "NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
        echo "ZIPALIGN=$ANDROID_HOME/build-tools/37.0.0/zipalign" >> "$GITHUB_ENV"
        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
    - if: inputs.producer == 'true'
      shell: bash
      run: |
        rustup toolchain install 1.97.1 --profile minimal
        rustup override set 1.97.1
        rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
        cargo install cargo-ndk --version 4.1.2 --locked
    - if: inputs.producer != 'true' && runner.os == 'macOS'
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.3.10
    - if: inputs.producer != 'true' && runner.os == 'macOS'
      shell: bash
      run: gem install cocoapods --version 1.16.2 --no-document
    - if: inputs.producer != 'true'
      shell: bash
      run: |
        curl --fail --location --retry 3 https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.4.0/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
        unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-install"
        echo "$RUNNER_TEMP/maestro-install/maestro/bin" >> "$GITHUB_PATH"
